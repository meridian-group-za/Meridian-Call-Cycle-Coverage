<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Regional footprint</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#0f2c4f; color:#eef3f9; font-family:'Poppins', system-ui, sans-serif; overflow:hidden; }
  #wrap { position:relative; width:100%; height:100%; }
  svg { display:block; width:100%; height:100%; }
  .land { fill:#0a2140; stroke:#1c3f6b; stroke-width:0.8; }
  .neighbour { fill:#0c2440; stroke:#163454; stroke-width:0.6; }
  .bubble { fill:#ec6d25; fill-opacity:0.75; stroke:#f2955c; stroke-width:1; cursor:default; }
  .lbl { font-size:10.5px; fill:#c9d7e6; }
  .lbl-v { font-size:10.5px; fill:#eef3f9; font-weight:600; }
  #tip { position:absolute; pointer-events:none; opacity:0; background:#0a2140; border:1px solid #1c3f6b;
    border-radius:8px; padding:7px 10px; font-size:11px; line-height:1.5; white-space:nowrap; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  #tip b { color:#f2955c; }
  #legend { position:absolute; left:14px; bottom:12px; font-size:10px; color:#7ea1c9; line-height:1.6; }
</style>
</head>
<body>
<div id="wrap">
  <svg id="map"></svg>
  <div id="tip"></div>
  <div id="legend">Circle area = stores covered · label shows stores and dual-coverage rate</div>
</div>
<script>
const REGION_POINTS = {
  'Gauteng':        { lon: 28.10, lat: -26.20, side: 'right' },
  'KwaZulu Natal':  { lon: 30.90, lat: -29.20, side: 'right' },
  'Western Cape':   { lon: 19.00, lat: -33.60, side: 'left'  },
  'Mpumalanga':     { lon: 30.60, lat: -25.60, side: 'right' },
  'Free State':     { lon: 26.80, lat: -28.80, side: 'left'  },
  'East London':    { lon: 27.90, lat: -32.90, side: 'right' },
  'Limpopo':        { lon: 29.50, lat: -23.60, side: 'right' },
  'Port Elizabeth': { lon: 25.60, lat: -33.90, side: 'right' },
  'North West':     { lon: 25.60, lat: -26.10, side: 'left'  },
  'SWD':            { lon: 22.30, lat: -33.70, side: 'left'  },
};
const SA_ID = '710';
const fmt = (v) => Number(v).toLocaleString('en-ZA');
const storeKey = (r) => (r.storeCode || '') + '|' + (r.storeName || '');

async function main(){
  const [topo, raw] = await Promise.all([
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then((r) => r.json()),
    fetch('mock-data/call-cycle-master.json').then((r) => r.json()),
  ]);

  const stores = new Map();
  const touch = (r, which) => {
    const k = storeKey(r);
    let e = stores.get(k);
    if (!e) { e = { region: r.region || 'Unknown', rep: false, merch: false }; stores.set(k, e); }
    e[which] = true;
  };
  (raw.rep_rows || []).forEach((r) => touch(r, 'rep'));
  (raw.merch_rows || []).forEach((r) => touch(r, 'merch'));

  const byRegion = new Map();
  stores.forEach((e) => {
    let g = byRegion.get(e.region);
    if (!g) { g = { region: e.region, stores: 0, both: 0 }; byRegion.set(e.region, g); }
    g.stores++; if (e.rep && e.merch) g.both++;
  });
  const data = [...byRegion.values()].filter((g) => REGION_POINTS[g.region]).sort((a, b) => b.stores - a.stores);

  const countries = topojson.feature(topo, topo.objects.countries).features;
  const sa = countries.filter((f) => String(f.id) === SA_ID);
  const neighbours = countries.filter((f) => ['426', '516', '748', '072', '716', '508', '024'].indexOf(String(f.id)) >= 0);

  const svg = d3.select('#map');
  const node = svg.node();
  const W = node.clientWidth || 900, H = node.clientHeight || 420;
  svg.attr('viewBox', '0 0 ' + W + ' ' + H);

  const projection = d3.geoMercator().fitExtent([[26, 18], [W - 26, H - 18]], { type: 'FeatureCollection', features: sa });
  const path = d3.geoPath(projection);

  svg.append('g').selectAll('path').data(neighbours).join('path').attr('class', 'neighbour').attr('d', path);
  svg.append('g').selectAll('path').data(sa).join('path').attr('class', 'land').attr('d', path);

  const rScale = d3.scaleSqrt().domain([0, d3.max(data, (d) => d.stores) || 1]).range([4, 30]);
  const tip = d3.select('#tip');
  const g = svg.append('g');

  const item = g.selectAll('g.pt').data(data).join('g').attr('class', 'pt')
    .attr('transform', (d) => {
      const p = projection([REGION_POINTS[d.region].lon, REGION_POINTS[d.region].lat]);
      return 'translate(' + p[0] + ',' + p[1] + ')';
    });

  item.append('circle').attr('class', 'bubble').attr('r', (d) => rScale(d.stores))
    .on('mousemove', function (event, d) {
      const rate = d.stores ? (d.both / d.stores * 100).toFixed(1) : '0.0';
      tip.style('opacity', 1)
        .style('left', (event.pageX + 14) + 'px').style('top', (event.pageY - 10) + 'px')
        .html('<b>' + d.region + '</b><br>' + fmt(d.stores) + ' stores covered<br>' + fmt(d.both) + ' with rep + merch (' + rate + '%)');
    })
    .on('mouseleave', () => tip.style('opacity', 0));

  const label = item.append('g')
    .attr('transform', (d) => {
      const r = rScale(d.stores) + 7;
      return 'translate(' + (REGION_POINTS[d.region].side === 'left' ? -r : r) + ',0)';
    })
    .attr('text-anchor', (d) => (REGION_POINTS[d.region].side === 'left' ? 'end' : 'start'));

  label.append('text').attr('class', 'lbl-v').attr('dy', '-0.15em').text((d) => d.region);
  label.append('text').attr('class', 'lbl').attr('dy', '1.15em')
    .text((d) => fmt(d.stores) + ' · ' + (d.stores ? (d.both / d.stores * 100).toFixed(1) : '0.0') + '% dual');
}
main().catch((e) => {
  document.getElementById('legend').textContent = 'Map failed to load: ' + e.message;
});
</script>
</body>
</html>
